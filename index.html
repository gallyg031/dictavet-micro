<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://script.google.com https://script.googleusercontent.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#31444c">
<title>DictaVet · Dictaphone</title>
<!--
  DictaVet — page dictaphone externe (PLAN_MVP Lot 5).
  Page statique autonome : aucune dépendance, aucun secret. Elle enregistre la voix et :
   1. la DÉPOSE directement sur le serveur DictaVet (web app Apps Script, doPost) avec le
      jeton à usage unique reçu de l'app ; l'app vient la chercher quand elle est au premier
      plan (src/MicroDepot.gs). L'onglet de l'app peut dormir pendant la dictée (essai du
      20/11/2026 : l'envoi par postMessage vers un onglet endormi se perdait).
      Seules connexions permises par la CSP : script.google.com et sa redirection.
   2. sinon, la propose en téléchargement / partage, à déposer ensuite dans l'app.

  Paramètres d'URL (posés par l'app) :
    t = jeton de dépôt (48 à 96 caractères [A-Za-z0-9])
    u = adresse de la web app (https://script.google.com/macros/s/…/exec, seule forme admise)

  Le jeton et l'adresse sont gardés avec l'enregistrement (IndexedDB) : un enregistrement
  repris après fermeture de la page s'envoie encore, tant que le jeton est valide (12 h).

  Envoi : POST u, corps texte JSON { t, mime, durationMs, data } (requête « simple », sans
  pré-vol CORS), réponse { ok, code, message }. Tant que la web app est en accès « moi
  uniquement », la réponse n'est pas lisible : second essai en no-cors avec les cookies
  Google ; c'est alors l'app qui confirme la réception.
-->
<style>
  :root{
    --ardoise:#31444c; --ardoise-2:#22323a; --cuivre:#875a35; --cuivre-2:#6e4828;
    --fond:#f7f4ef; --carte:#ffffff; --ligne:#ddd5ca; --texte:#1f2a2f; --doux:#5b6a70;
    --ok:#2f6b3a; --ok-fond:#e6f1e7; --alerte:#8a5a00; --alerte-fond:#fdf1d6;
    --err:#9b2c1f; --err-fond:#fbe5e1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fond);color:var(--texte)}
  body{font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
  .brand{font-weight:700;font-size:20px;color:var(--ardoise);letter-spacing:.2px}
  .brand span{color:var(--cuivre)}
  .link{font-size:14px;font-weight:600;border-radius:999px;padding:6px 12px;background:#e9e4dc;color:var(--doux);white-space:nowrap}
  .link.on{background:var(--ok-fond);color:var(--ok)}
  .link.off{background:var(--alerte-fond);color:var(--alerte)}
  .card{background:var(--carte);border:1px solid var(--ligne);border-radius:18px;padding:20px 16px;margin:10px 0}
  .center{text-align:center}
  #recBtn{width:168px;height:168px;border-radius:50%;border:0;margin:6px auto 4px;display:flex;align-items:center;
          justify-content:center;flex-direction:column;gap:6px;background:var(--cuivre);color:#fff;font-family:inherit;font-weight:700;font-size:19px;line-height:1.1;
          box-shadow:0 6px 0 var(--cuivre-2);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #recBtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--cuivre-2)}
  #recBtn.rec{background:var(--ardoise);box-shadow:0 6px 0 var(--ardoise-2)}
  #recBtn[disabled]{opacity:.45;cursor:default}
  #recBtn svg{width:54px;height:54px;fill:#fff}
  .timer{font:700 44px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ardoise);margin:14px 0 2px;font-variant-numeric:tabular-nums}
  .sub{color:var(--doux);font-size:15px}
  .meter{height:18px;border-radius:9px;background:#ece6dd;overflow:hidden;margin:16px 0 6px;border:1px solid var(--ligne)}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7d5a,#7fa35c 60%,#c08a3e);transition:width .08s linear}
  .hear{font-size:15px;font-weight:600;min-height:22px}
  .hear.yes{color:var(--ok)} .hear.no{color:var(--alerte)}
  .msg{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:16px}
  .msg b{display:block;margin-bottom:2px}
  .msg.err{background:var(--err-fond);color:var(--err)}
  .msg.warn{background:var(--alerte-fond);color:var(--alerte)}
  .msg.ok{background:var(--ok-fond);color:var(--ok)}
  .msg.info{background:#e9eef0;color:var(--ardoise)}
  .hidden{display:none!important}
  audio{width:100%;margin:6px 0 10px}
  .facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--doux);margin-bottom:12px}
  .facts b{color:var(--texte)}
  .btn{display:flex;width:100%;min-height:58px;align-items:center;justify-content:center;gap:10px;border-radius:14px;
       border:2px solid var(--ardoise);background:#fff;color:var(--ardoise);font-family:inherit;font-weight:700;font-size:18px;line-height:1.2;margin:10px 0 0;
       padding:10px 14px;cursor:pointer;text-decoration:none;touch-action:manipulation}
  .btn.primary{background:var(--ardoise);color:#fff}
  .btn.copper{background:var(--cuivre);border-color:var(--cuivre);color:#fff}
  .btn[disabled]{opacity:.45;cursor:default}
  .foot{font-size:13px;color:var(--doux);margin:16px 2px 0}
  @media (max-height:640px){#recBtn{width:136px;height:136px}.timer{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Dicta<span>Vet</span> · Dictaphone</div>
    <div class="link" id="link">…</div>
  </header>

  <div id="boot" class="msg info hidden"></div>

  <section class="card center" id="recCard">
    <button id="recBtn" type="button" aria-label="Commencer l'enregistrement">
      <svg id="icoMic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 6-6.9h-2z"/></svg>
      <svg id="icoStop" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span id="recLabel">Enregistrer</span>
    </button>
    <div class="timer" id="timer">00:00</div>
    <div class="sub" id="limit">Limite : 10 minutes</div>
    <div class="meter" aria-hidden="true"><i id="level"></i></div>
    <div class="hear" id="hear">&nbsp;</div>
    <div id="recMsg"></div>
  </section>

  <section class="card hidden" id="reviewCard">
    <div style="font-weight:700;color:var(--ardoise);margin-bottom:6px">Réécouter avant d'envoyer</div>
    <audio id="player" controls preload="metadata"></audio>
    <div class="facts" id="facts"></div>
    <button class="btn primary" id="sendBtn" type="button">Envoyer à DictaVet</button>
    <div id="sendMsg"></div>
    <a class="btn" id="dlBtn" href="#" download>Télécharger l'enregistrement</a>
    <button class="btn hidden" id="shareBtn" type="button">Partager l'enregistrement…</button>
    <button class="btn" id="againBtn" type="button">Recommencer</button>
  </section>

  <div id="resume" class="msg warn hidden"></div>

  <p class="foot">L'enregistrement reste sur cet appareil jusqu'à ce que vous l'envoyiez. Il ne part que vers le serveur DictaVet, nulle part ailleurs.
  Gardez-la ouverte et l'écran allumé pendant la dictée.</p>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- Réglages ---------------- */
  var MAX_MS = 10 * 60 * 1000;          // limite de durée
  var WARN_MS = 9 * 60 * 1000;          // avertissement une minute avant
  var SEND_TIMEOUT_MS = 120000;         // délai maximal d'un envoi
  var SILENCE_HINT_MS = 5000;           // « aucun son » au bout de 5 s de silence
  // Seule cible d'envoi admise : une web app Apps Script (l'audio ne part jamais ailleurs,
  // même avec un lien fabriqué). /dev : déploiement de test, propriétaire seulement.
  var POST_URL_RE = /^https:\/\/script\.google\.com\/(a\/[a-z0-9.-]+\/)?macros\/s\/[A-Za-z0-9_-]{20,}\/(exec|dev)$/;
  // Formats candidats, par ordre de préférence. Débit réduit : la voix reste
  // intelligible, et Gemini ré-échantillonne de toute façon à 16 kbit/s.
  var FORMATS = [
    { mime: 'audio/webm;codecs=opus', bps: 24000, ext: 'webm' },   // Chrome, Edge, Android
    { mime: 'audio/ogg;codecs=opus', bps: 24000, ext: 'ogg' },     // Firefox
    { mime: 'audio/mp4;codecs=mp4a.40.2', bps: 32000, ext: 'm4a' },// Safari (iPhone, Mac)
    { mime: 'audio/mp4', bps: 32000, ext: 'm4a' },
    { mime: 'audio/aac', bps: 32000, ext: 'aac' }
  ];
  var DB_NAME = 'vetdict-micro', DB_STORE = 'rec', KEEP_MS = 24 * 3600 * 1000;

  /* ---------------- Utilitaires ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  function show(el, on) { el.classList.toggle('hidden', !on); }
  function msg(boxId, kind, title, text) {
    var box = $(boxId);
    box.innerHTML = '';
    if (!kind) return;
    var d = document.createElement('div');
    d.className = 'msg ' + kind;
    if (title) { var b = document.createElement('b'); b.textContent = title; d.appendChild(b); }
    if (text) d.appendChild(document.createTextNode(text));
    box.appendChild(d);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clock(ms) { var s = Math.floor(ms / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function size(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' Ko' : (b / 1048576).toFixed(1).replace('.', ',') + ' Mo'; }
  function linkOk(t, u) { return /^[A-Za-z0-9]{48,96}$/.test(t || '') && POST_URL_RE.test(u || ''); }

  /* ---------------- Liaison avec l'app ---------------- */
  var params = new URLSearchParams(location.search);
  var link = { t: params.get('t') || '', u: params.get('u') || '' };
  var linked = linkOk(link.t, link.u);
  var sending = false;

  function setLink() {
    var el = $('link');
    el.className = 'link ' + (linked ? 'on' : 'off');
    el.textContent = linked ? 'Relié à DictaVet' : 'Mode autonome';
  }
  if ((link.t || link.u) && !linked) {
    $('boot').textContent = 'Lien d\'ouverture non reconnu : la page fonctionne en mode autonome. ' +
      'Rouvrez le dictaphone depuis DictaVet, ou téléchargez l\'enregistrement puis déposez-le dans DictaVet.';
    show($('boot'), true);
  }
  setLink();

  /* ---------------- Enregistrement ---------------- */
  var st = { stream: null, rec: null, chunks: [], fmt: null, t0: 0, elapsed: 0, tick: 0,
             ctx: null, raf: 0, lastSound: 0, warned: false, wake: null, hidden: false, stopReason: '' };
  var result = null; // { blob, mime, ext, durationMs, at }

  function pickFormat() {
    if (typeof MediaRecorder === 'undefined') return null;
    for (var i = 0; i < FORMATS.length; i++) {
      try { if (MediaRecorder.isTypeSupported(FORMATS[i].mime)) return FORMATS[i]; } catch (e) { /* suivant */ }
    }
    return { mime: '', bps: 32000, ext: '' }; // format par défaut du navigateur
  }
  function extFor(mime) {
    mime = (mime || '').toLowerCase();
    if (mime.indexOf('webm') >= 0) return 'webm';
    if (mime.indexOf('ogg') >= 0) return 'ogg';
    if (mime.indexOf('mp4') >= 0 || mime.indexOf('m4a') >= 0) return 'm4a';
    if (mime.indexOf('aac') >= 0) return 'aac';
    return 'audio';
  }

  function explainError(e) {
    var n = (e && e.name) || '';
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') {
      return ['Accès au micro refusé.', 'Autorisez le micro pour cette page : sur iPhone, Réglages › Safari › Micro (ou « aA » dans la barre d\'adresse › Réglages du site) ; sur Android, touchez le cadenas à gauche de l\'adresse › Autorisations › Micro. Puis rechargez la page.'];
    }
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') {
      return ['Aucun micro détecté.', 'Branchez ou activez un micro, puis réessayez.'];
    }
    if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError') {
      return ['Le micro est occupé.', 'Une autre application l\'utilise peut-être (appel, dictaphone). Fermez-la puis réessayez.'];
    }
    return ['Le micro n\'a pas pu démarrer.', (n ? n + ' : ' : '') + ((e && e.message) || String(e))];
  }

  function unsupported() {
    if (!window.isSecureContext) return 'Cette page doit être ouverte en https:// pour accéder au micro.';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'Ce navigateur ne donne pas accès au micro. Utilisez Chrome (Android, ordinateur) ou Safari (iPhone) à jour.';
    if (typeof MediaRecorder === 'undefined') return 'Ce navigateur ne sait pas enregistrer le son. Mettez à jour Safari (iOS 14.5 ou plus récent) ou utilisez Chrome.';
    return '';
  }

  function setRecUi(on) {
    $('recBtn').classList.toggle('rec', on);
    $('recBtn').setAttribute('aria-label', on ? 'Arrêter l\'enregistrement' : 'Commencer l\'enregistrement');
    $('recLabel').textContent = on ? 'Arrêter' : 'Enregistrer';
    show($('icoMic'), !on); show($('icoStop'), on);
  }

  function start() {
    var why = unsupported();
    if (why) { msg('recMsg', 'err', 'Enregistrement impossible.', why); return; }
    if (result && !result.sent && !confirm('Remplacer l\'enregistrement précédent ?')) return;
    msg('recMsg'); msg('sendMsg');
    $('recBtn').disabled = true;
    navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function (stream) {
      st.stream = stream;
      st.fmt = pickFormat();
      var rec;
      try {
        var opts = { audioBitsPerSecond: st.fmt.bps };
        if (st.fmt.mime) opts.mimeType = st.fmt.mime;
        rec = new MediaRecorder(stream, opts);
      } catch (e) {
        rec = new MediaRecorder(stream); // réglages refusés : format par défaut
      }
      st.rec = rec; st.chunks = [];
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) st.chunks.push(ev.data); };
      rec.onstop = finish;
      rec.onerror = function (ev) { msg('recMsg', 'err', 'Erreur d\'enregistrement.', String((ev && ev.error) || ev)); };
      rec.start(1000);
      st.t0 = Date.now(); st.elapsed = 0; st.warned = false; st.hidden = false; st.stopReason = '';
      st.lastSound = Date.now();
      st.tick = setInterval(onTick, 250);
      startMeter(stream);
      keepAwake(true);
      setRecUi(true);
      show($('reviewCard'), false);
      $('recBtn').disabled = false;
    }).catch(function (e) {
      $('recBtn').disabled = false;
      var t = explainError(e);
      msg('recMsg', 'err', t[0], t[1]);
    });
  }

  function stop(reason) {
    if (!st.rec || st.rec.state === 'inactive') return;
    st.stopReason = reason || '';
    st.elapsed = Date.now() - st.t0;
    try { st.rec.stop(); } catch (e) { finish(); }
  }

  function cleanup() {
    clearInterval(st.tick);
    stopMeter();
    keepAwake(false);
    if (st.stream) st.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* déjà arrêté */ } });
    st.stream = null;
    setRecUi(false);
  }

  function finish() {
    var mime = (st.rec && st.rec.mimeType) || (st.fmt && st.fmt.mime) || (st.chunks[0] && st.chunks[0].type) || 'audio/webm';
    var blob = new Blob(st.chunks, { type: mime });
    var dur = st.elapsed || (Date.now() - st.t0);
    st.rec = null;
    cleanup();
    if (!blob.size) { msg('recMsg', 'err', 'Enregistrement vide.', 'Aucun son n\'a été enregistré. Réessayez.'); return; }
    setResult({ blob: blob, mime: mime, ext: (st.fmt && st.fmt.ext) || extFor(mime), durationMs: dur, at: Date.now() });
    if (st.stopReason === 'max') msg('recMsg', 'warn', 'Limite de 10 minutes atteinte.', 'L\'enregistrement a été arrêté. Envoyez-le, puis commencez-en un autre pour la suite.');
    else if (st.hidden) msg('recMsg', 'warn', 'La page a été quittée pendant l\'enregistrement.', 'Réécoutez pour vérifier que tout a été pris.');
    saveLocal(result);
  }

  function onTick() {
    var ms = Date.now() - st.t0;
    $('timer').textContent = clock(ms);
    if (ms >= WARN_MS && !st.warned) {
      st.warned = true;
      msg('recMsg', 'warn', 'Plus qu\'une minute.', 'L\'enregistrement s\'arrêtera automatiquement à 10 minutes.');
      try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* pas de vibreur */ }
    }
    if (ms >= MAX_MS) stop('max');
  }

  /* ---------------- Niveau sonore ---------------- */
  function startMeter(stream) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { $('hear').textContent = 'Niveau sonore indisponible sur ce navigateur.'; return; }
    try {
      var ctx = new AC();
      var src = ctx.createMediaStreamSource(stream);
      var an = ctx.createAnalyser();
      an.fftSize = 1024;
      src.connect(an);
      if (ctx.resume) ctx.resume();
      st.ctx = ctx;
      var buf = new Uint8Array(an.fftSize);
      if (ctx.state === 'suspended') {
        // Démarrage automatique sans geste : la jauge attend le premier toucher (l'enregistrement, lui, tourne).
        var wake = function () { try { ctx.resume(); } catch (e) { /* tant pis */ } };
        document.addEventListener('pointerdown', wake, { once: true });
      }
      var loop = function () {
        if (ctx.state === 'suspended') {
          st.lastSound = Date.now();
          $('hear').className = 'hear yes';
          $('hear').textContent = 'Enregistrement en cours : parlez. (Touchez l\'écran pour voir le niveau sonore.)';
          st.raf = requestAnimationFrame(loop); return;
        }
        an.getByteTimeDomainData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / buf.length);
        var lvl = Math.min(1, Math.sqrt(rms) * 1.6); // échelle « perçue » : la voix normale remplit la moitié
        $('level').style.width = Math.round(lvl * 100) + '%';
        if (rms > 0.02) st.lastSound = Date.now();
        var quiet = Date.now() - st.lastSound > SILENCE_HINT_MS;
        var h = $('hear');
        h.className = 'hear ' + (quiet ? 'no' : 'yes');
        h.textContent = quiet ? 'Aucun son capté : parlez plus près du téléphone, ou vérifiez le micro.' : 'Le micro capte votre voix.';
        st.raf = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) {
      $('hear').textContent = 'Niveau sonore indisponible (' + e.name + ').';
    }
  }
  function stopMeter() {
    cancelAnimationFrame(st.raf);
    if (st.ctx) { try { st.ctx.close(); } catch (e) { /* déjà fermé */ } }
    st.ctx = null;
    $('level').style.width = '0';
    $('hear').innerHTML = '&nbsp;';
  }

  /* ---------------- Écran allumé ---------------- */
  function keepAwake(on) {
    if (!('wakeLock' in navigator)) return;
    if (!on) { if (st.wake) { st.wake.release().catch(function () {}); st.wake = null; } return; }
    navigator.wakeLock.request('screen').then(function (w) { st.wake = w; }).catch(function () { st.wake = null; });
  }
  document.addEventListener('visibilitychange', function () {
    var recording = st.rec && st.rec.state === 'recording';
    if (document.visibilityState === 'hidden' && recording) st.hidden = true;
    if (document.visibilityState === 'visible' && recording && !st.wake) keepAwake(true);
  });
  window.addEventListener('beforeunload', function (ev) {
    if ((st.rec && st.rec.state === 'recording') || (result && !result.sent)) { ev.preventDefault(); ev.returnValue = ''; }
  });

  /* ---------------- Réécoute, envoi, repli ---------------- */
  var objectUrl = '';
  function setResult(r) {
    // Lien d'envoi : celui de l'ouverture en cours, sinon celui gardé avec l'enregistrement.
    if (!linked && r.link && linkOk(r.link.t, r.link.u)) { link = r.link; linked = true; setLink(); }
    r.link = linked ? { t: link.t, u: link.u } : null;
    result = r;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(r.blob);
    $('player').src = objectUrl;
    $('timer').textContent = clock(r.durationMs);
    var d = new Date(r.at);
    var name = 'dictee-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.' + (r.ext || 'audio');
    r.name = name;
    $('dlBtn').href = objectUrl;
    $('dlBtn').setAttribute('download', name);
    var f = $('facts'); f.innerHTML = '';
    [['Durée', clock(r.durationMs)], ['Taille', size(r.blob.size)], ['Format', (r.mime.split(';')[0] || '?').replace('audio/', '')]]
      .forEach(function (x) { var s = document.createElement('span'); s.innerHTML = x[0] + ' : <b></b>'; s.lastChild.textContent = x[1]; f.appendChild(s); });
    var canShare = false;
    try {
      r.file = new File([r.blob], name, { type: r.mime.split(';')[0] });
      canShare = !!(navigator.canShare && navigator.canShare({ files: [r.file] }));
    } catch (e) { canShare = false; }
    show($('shareBtn'), canShare);
    show($('reviewCard'), true);
    show($('resume'), false);
    updateSend();
  }

  function updateSend() {
    var b = $('sendBtn');
    if (!result) return;
    if (!linked) {
      show(b, false);
      if (!result.sent) msg('sendMsg', 'info', 'Cette page n\'est pas reliée à DictaVet.',
        'Pour envoyer cet enregistrement : retournez dans DictaVet et touchez de nouveau le bouton qui ouvre le dictaphone. Le dictaphone se rouvrira et vous proposera de reprendre cet enregistrement, avec le bouton « Envoyer à DictaVet ». Sinon, téléchargez-le puis déposez-le dans DictaVet.');
      return;
    }
    show(b, true);
    b.disabled = sending || !!result.sent;
  }

  function toBase64(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { var s = String(fr.result); res(s.slice(s.indexOf(',') + 1)); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  function withTimeout(p) {
    return new Promise(function (res, rej) {
      var tm = setTimeout(function () { rej(new Error('délai dépassé')); }, SEND_TIMEOUT_MS);
      p.then(function (x) { clearTimeout(tm); res(x); }, function (e) { clearTimeout(tm); rej(e); });
    });
  }

  var RETOUR = 'Revenez à DictaVet par le bouton des onglets du navigateur (le carré avec un chiffre, en haut à droite sur Android) : la dictée y sera transcrite.';

  // keep : réception non confirmée → la copie locale est gardée (24 h) pour pouvoir la reprendre.
  function done(kind, title, text, keep) {
    sending = false;
    result.sent = true;
    if (!keep) clearLocal();
    msg('sendMsg', kind, title, text);
    updateSend();
  }

  function send() {
    if (!result || !linked || sending || result.sent) return;
    var r = result, l = r.link || link;
    sending = true; updateSend();
    msg('sendMsg', 'info', 'Envoi en cours…', 'Gardez cette page ouverte quelques secondes.');
    toBase64(r.blob).then(function (b64) {
      var body = JSON.stringify({ t: l.t, mime: r.mime, durationMs: r.durationMs, data: b64 });
      // 1) Réponse lisible : web app ouverte en accès anonyme (après le Lot 6).
      return withTimeout(fetch(l.u, { method: 'POST', body: body, credentials: 'omit', redirect: 'follow' }))
        .then(function (resp) { return resp.json(); })
        .then(function (j) { return { readable: true, j: j }; }, function () {
          // 2) Réponse illisible (accès « moi uniquement » : connexion Google exigée, CORS) :
          //    envoi avec les cookies Google, sans pouvoir lire la réponse.
          return withTimeout(fetch(l.u, { method: 'POST', body: body, mode: 'no-cors', credentials: 'include', redirect: 'follow' }))
            .then(function () { return { readable: false }; });
        });
    }).then(function (x) {
      if (!x.readable) {
        done('ok', 'Envoyé.', RETOUR + ' Si elle n\'y arrive pas, rouvrez le dictaphone depuis DictaVet : cet enregistrement vous sera reproposé.', true);
        return;
      }
      var j = x.j || {};
      if (j.ok || j.code === 'DEJA') { done('ok', 'Reçu par DictaVet.', RETOUR); return; }
      sending = false;
      msg('sendMsg', 'err', 'Envoi refusé.', (j.message || 'Erreur inconnue.') + ' Vous pouvez aussi télécharger l\'enregistrement puis le déposer dans DictaVet.');
      updateSend();
    }).catch(function (e) {
      sending = false;
      msg('sendMsg', 'err', 'Envoi impossible.', (e && e.message ? e.message : String(e)) +
        '. Vérifiez la connexion Internet puis touchez de nouveau « Envoyer à DictaVet ». L\'enregistrement reste gardé sur ce téléphone.');
      updateSend();
    });
  }

  $('recBtn').addEventListener('click', function () {
    if (st.rec && st.rec.state === 'recording') stop('user'); else start();
  });
  $('sendBtn').addEventListener('click', send);
  $('againBtn').addEventListener('click', function () { start(); });
  $('shareBtn').addEventListener('click', function () {
    if (!result || !result.file) return;
    navigator.share({ files: [result.file], title: result.name }).catch(function (e) {
      if (e && e.name !== 'AbortError') msg('sendMsg', 'err', 'Partage impossible.', e.message || String(e));
    });
  });

  /* ---------------- Filet anti-perte (IndexedDB, 24 h) ---------------- */
  function db() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error('IndexedDB absent'));
      var rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore(DB_STORE); };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    });
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(DB_STORE, mode), out;
        out = fn(t.objectStore(DB_STORE));
        t.oncomplete = function () { res(out && out.result); d.close(); };
        t.onerror = function () { rej(t.error); d.close(); };
      });
    });
  }
  function saveLocal(r) {
    tx('readwrite', function (s) { return s.put({ blob: r.blob, mime: r.mime, ext: r.ext, durationMs: r.durationMs, at: r.at, link: r.link || null }, 'last'); })
      .catch(function () { /* stockage indisponible : pas de filet */ });
  }
  function clearLocal() { tx('readwrite', function (s) { return s.delete('last'); }).catch(function () {}); }
  tx('readonly', function (s) { return s.get('last'); }).then(function (r) {
    if (!r || !r.blob) return false;
    if (Date.now() - r.at > KEEP_MS) { clearLocal(); return false; }
    var d = new Date(r.at), box = $('resume');
    box.innerHTML = '';
    var b = document.createElement('b');
    b.textContent = 'Un enregistrement non envoyé du ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' à ' + pad(d.getHours()) + 'h' + pad(d.getMinutes()) + ' (' + clock(r.durationMs) + ') est disponible.';
    box.appendChild(b);
    var k = document.createElement('button'); k.className = 'btn primary'; k.type = 'button'; k.textContent = 'Le reprendre';
    k.onclick = function () { setResult(r); };
    var x = document.createElement('button'); x.className = 'btn'; x.type = 'button'; x.textContent = 'L\'effacer';
    x.onclick = function () { clearLocal(); show(box, false); };
    box.appendChild(k); box.appendChild(x);
    show(box, true);
    return true;
  }).catch(function () { return false; /* rien à reprendre */ }).then(autoStart);

  var why = unsupported();
  if (why) { msg('recMsg', 'err', 'Enregistrement impossible.', why); $('recBtn').disabled = true; }

  /* ---------------- Démarrage automatique ----------------
     Ouverte depuis DictaVet (lien valide), la page enregistre tout de suite : le véto a
     déjà touché le micro dans l'app. Une seule fois par lien et par onglet (sessionStorage),
     pour qu'un onglet rechargé par Android ne relance pas un enregistrement ; jamais s'il
     reste un enregistrement non envoyé à reprendre. Si le navigateur refuse le micro sans
     geste, le bouton « Enregistrer » reste là. */
  function autoStart(leftover) {
    if (!linked || leftover || why || result) return;
    var key = 'dictavet-auto-' + link.t.slice(0, 16);
    try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { /* sans stockage : on démarre quand même */ }
    start();
  }
})();
</script>
</body>
</html>
